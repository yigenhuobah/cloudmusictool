plugins {
    id 'com.android.application'
}

// 签名配置从 keystore.properties 读（该文件在 .gitignore 里，不入仓库）。
// release 必须使用正式签名：缺失或 storeFile 未配置时在执行前硬失败，
// 禁止回退 debug 签名、禁止产出未签名包。debug 不受影响。
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasKeystore = keystorePropsFile.exists() && keystoreProps.getProperty("storeFile")

android {
    namespace 'com.cloudmusictool.app'
    // 统一基线 compileSdk 37（Android 17）。libxposed api/service 102.0.0 的 AAR
    // 元数据要求 minCompileSdk 37，因此不再关闭 check*AarMetadata 校验。
    compileSdk 37

    defaultConfig {
        applicationId "io.github.yigenhuobah.cloudmusictool"
        minSdk 29
        targetSdk 36
        versionCode 9
        versionName "2.3.0"
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 只在有正式 keystore 时绑定签名；缺失时由底部 taskGraph 守卫硬失败，
            // 不会回退 debug 签名。
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                output.outputFileName = "cloudmusictool-${variant.versionName}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    // DexKit 兜底需要在目标进程用 System.load 加载 libdexkit.so，
    // 因此必须让 AGP 把 .so 按传统方式落盘（nativeLibraryDir 可读）。
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    compileOnly 'io.github.libxposed:annotation:1.0.0'

    implementation 'io.github.libxposed:service:102.0.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'

    // DexKit 2.3.0 (最新版，用于动态定位兜底)
    implementation 'org.luckypray:dexkit:2.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// release 必须使用正式签名：keystore.properties 缺失 / storeFile 未配置时，
// 只要本次任务图里出现 release 变体任务就在执行前失败，避免静默产出 debug 签名版本。
// 用 taskGraph.whenReady 覆盖 assemble/package/install/bundle 全部入口；debug 不受影响。
def releaseTaskNames = ["assembleRelease", "packageRelease", "installRelease", "bundleRelease"]
gradle.taskGraph.whenReady { graph ->
    if (!hasKeystore && graph.allTasks.any { it.project == project && releaseTaskNames.contains(it.name) }) {
        throw new GradleException("缺少有效 keystore.properties（storeFile 未配置）：release 构建必须使用正式签名")
    }
}
